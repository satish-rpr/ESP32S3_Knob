light:
  - platform: lvgl
    name: "Desk Lamp"
    id: desklamp_light
    widget: desklamp_led_indicator
    default_transition_length: 0ms

switch:
  - platform: lvgl
    id: desklamp_switch
    name: "Desk Lamp switch"
    widget: desklamp_led_switch_widget

lvgl:
  pages:
    - id: desklamp_page
      widgets:
        - obj:
            id: background_4
            x: 0
            y: 0
            width: 360
            height: 360
            bg_color: 0x000000
            border_width: 0
            pad_all: 0
        
        - switch:
            id: desklamp_led_switch_widget
            width: 150
            height: 80
            align: center
            on_value:
              then:
              - if:
                  condition:
                    - lambda: 'return x == 1;'
                  then:
                    - light.turn_on: desklamp_light
                    - lambda: 'ESP_LOGI("INFO","Desk Lamp ON");'
                  else:
                    - light.turn_off: desklamp_light
                    - lambda: 'ESP_LOGI("INFO","Desk Lamp OFF");'

        - led:
            id: desklamp_led_indicator
            width: 50
            height: 50
            x: -130
            y: -156
            align: bottom_mid
            color: 0xFDF4DC

        - label:
            id: desklamp_page_label
            align: top_mid
            y: 40
            text: "Desk Lamp"
            text_font: roboto_32
            text_color: 0xFFFFFF
    
      on_swipe_left:
        - lambda: 'id(current_page) = 3;'
        - lvgl.page.show:
            id: living_3_page
            animation: over_left
            time: 400ms

      on_swipe_right:
        - lambda: 'id(current_page) = 5;'
        - lvgl.page.show:  
            id: dining_page
            animation: over_right
            time: 400ms